name: Build Docker image and create release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gorvcorp-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: VPS_1
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set version tag
        id: version
        run: echo "tag=build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker tarball
        id: archive
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          archive="gorvcorp-${VERSION_TAG}-linux-amd64.tar.gz"
          image="${IMAGE_NAME}:${VERSION_TAG}"
          docker pull --platform linux/amd64 "$image"
          docker save "$image" | gzip > "release/$archive"
          echo "file=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          cat > release/notes.md <<EOF
          Image Docker de GorvCorp pour Linux amd64, version ${VERSION_TAG}.

          Télécharger l'archive, puis lancer :

          \`\`\`sh
          docker load -i ${ARCHIVE}
          docker run --rm -p 8080:80 ${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          Application : http://localhost:8080
          EOF
          gh release create "$VERSION_TAG" \
            "release/$ARCHIVE" \
            --target "$GITHUB_SHA" \
            --title "GorvCorp ${VERSION_TAG}" \
            --notes-file release/notes.md

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOST: ${{ secrets.VPS_KNOWN_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_HTTP_PORT: ${{ vars.VPS_HTTP_PORT || '8080' }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Secret VPS_HOST manquant}"
          : "${VPS_SSH_KEY:?Secret VPS_SSH_KEY manquant}"
          : "${VPS_KNOWN_HOST:?Secret VPS_KNOWN_HOST manquant}"
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_HTTP_PORT" =~ ^[0-9]+$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOST" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_options=(-i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20)
          target="debian@${VPS_HOST}"
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" 'mkdir -p /home/debian/gorvcorp'
          scp "${ssh_options[@]}" -P "$VPS_SSH_PORT" "release/$ARCHIVE" scripts/deploy-vps.sh "$target:/home/debian/gorvcorp/"
          ssh "${ssh_options[@]}" -p "$VPS_SSH_PORT" "$target" \
            "bash /home/debian/gorvcorp/deploy-vps.sh /home/debian/gorvcorp/$ARCHIVE ${IMAGE_NAME}:${VERSION_TAG} $VPS_HTTP_PORT"
