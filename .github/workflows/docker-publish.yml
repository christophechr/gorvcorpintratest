name: Build Docker image and create release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and publish
        id: build
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export Docker tarball
        id: archive
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release
          archive="gorvcorp-${GITHUB_SHA}-linux-amd64.tar.gz"
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "$image"
          docker save "$image" | gzip > "release/$archive"
          (cd release && sha256sum "$archive" > "$archive.sha256")
          echo "file=$archive" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.archive.outputs.file }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          tag="docker-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release/notes.md <<EOF
          Image Docker de GorvCorp pour Linux amd64, commit ${GITHUB_SHA}.

          Télécharger l'archive et son fichier SHA-256, puis lancer :

          \`\`\`sh
          sha256sum -c ${ARCHIVE}.sha256
          docker load -i ${ARCHIVE}
          docker run --rm -p 8080:80 ${IMAGE_NAME}:sha-${GITHUB_SHA}
          \`\`\`

          Application : http://localhost:8080
          EOF
          gh release create "$tag" \
            "release/$ARCHIVE" "release/$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" \
            --title "Docker build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release/notes.md
